name: Deploy Vercel Production

on:
  push:
    branches:
      - main

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK no configurado en GitHub Secrets; omitiendo."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
